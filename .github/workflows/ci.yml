name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright src
      # Integration tests start postgres:17 via testcontainers (Docker is on the runner).
      # Tests marked `llm` need a model runner and are excluded by the default addopts.
      - run: uv run pytest
